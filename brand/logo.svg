@keyframes wm-glow  { 0% { opacity: 0; } 4% { opacity: 1; } 36% { opacity: 0; } }
@keyframes wm-tick  { 0% { fill: var(--wm-off); } 4% { fill: var(--wm-tick); } 30% { fill: var(--wm-off); } }
</style>
