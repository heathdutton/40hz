<title>40 Hz, slowed down 40 times. One frame on, two off.</title>
<style>
svg { --wm-ink: #E3E5EE; --wm-lit: #6C8CFF; --wm-peak: #C3CFFF; --wm-off: #2A3050; --wm-tick: #3B4470; }
@media (prefers-color-scheme: light) { svg { --wm-ink: #0E1116; --wm-lit: #6C8CFF; --wm-peak: #3F63F0; --wm-off: #D3D8E6; --wm-tick: #B4BDD8; } }
.wm-ink { fill: var(--wm-ink); }
.wm-lit { fill: var(--wm-lit); }
.wm-off { fill: var(--wm-off); }
.wm-glow { fill: var(--wm-lit); opacity: 0; }
