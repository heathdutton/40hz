name: Deploy to GitHub Pages

# A Pages site is public even when the repo is private, unless the account is on
# Enterprise Cloud with access control. Assume anything published is world-readable.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Publish an allowlist, never the repo root. upload-pages-artifact excludes only .git and
      # .github, so a root upload would also serve the local working transcript.
      - name: Stage the site
        run: |
          mkdir _site
          cp index.html app.js audio.js style.css .nojekyll _site/
          cp -R dist theme brand _site/
          echo "publishing:"; find _site -type f | sort

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'
      - id: deployment
        uses: actions/deploy-pages@v4
